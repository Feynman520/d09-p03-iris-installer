# IRIS 온톨로지 등록부 — 사람·계정·저장소·도구 노드 (정본 = IRIS-온톨로지.md 2-3절)
#
# 폴더로 표현되지 않는 것(바깥 사람·계정·저장소·도구)만 여기에 적는다.
# 실제로 필요한 항목이 생겼을 때 한 줄씩 늘린다. 미리 채워 두지 않는다.
#
# ⚠ 비밀값 금지 — 열쇠(API 키)·비밀번호·토큰 원문을 이 파일에 적지 않는다.
#    열쇠는 금고 파일(_agent\claude\secrets\.env) 한 곳에만 둔다.
# ⚠ persons 는 전부 sensitive 로 다룬다. 역할만 적고 연락처·주소는 넣지 않는다.
schema: iris-registry v1.0

# tools: 스크립트·스킬·플러그인·MCP 서버·실행기 등 이름으로 불리는 도구
#   <이름>:
#     kind: script | skill | plugin | mcp | launcher
#     path: IRIS 루트 기준 상대경로
#     readonly: true          # 읽기만 하는 도구면
#     schedule: <예약 실행 설명>   # 자동 실행되는 도구면
#     watches: [store:<저장소 키>]
tools: {}

# stores: 파일이 실제로 사는 바깥 저장소(클라우드 드라이브·외장 디스크 등)
#   <키>:
#     uri: <원격 경로>
#     kind: gdrive | external | network
#     mode: copy-only         # 지우지 않고 복사만 하는 저장소면
stores: {}

# accounts: 로그인 계정 — 어디에 쓰는지만 적는다. 비밀번호는 절대 적지 않는다.
#   <키>:
#     id: <계정 식별자>
#     used_for: [<도구 이름>, ...]
accounts: {}

# persons: 함께 일하는 바깥 사람 — 역할과 관련 폴더만.
#   <키>:
#     label: <표시 이름>
#     roles: [<역할>, ...]
#     hosted_at: <관련 R/D/P 폴더>
#     sensitive: true
persons: {}

# memory_stores: 에이전트별 기억이 사는 뿌리 폴더(검사 도구가 훑는 자리).
#   - agent: <에이전트 이름>
#     path: <IRIS 루트 기준 상대경로>
#     layout: <폴더·파일 배치 설명>
memory_stores: []
